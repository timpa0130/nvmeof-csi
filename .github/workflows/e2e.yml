name: e2e

on:
  pull_request:
    branches: [main]
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
    paths:
      - pkg/**
      - cmd/**
      - test/manual/e2e.sh
      - .github/**

jobs:
  e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    # Only run for non-draft pull requests.
    if: github.event.pull_request.draft == false

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - uses: ./.github/actions/setup-e2e

      - name: Create test pool
        run: |
          sudo truncate -s 8G /tmp/nvme-pool.img
          sudo zpool create nvme /tmp/nvme-pool.img

      - name: Build driver
        run: go build -o bin/nvmeof-csi ./cmd/nvmeof-csi

      - name: Install csc
        run: |
          go install github.com/rexray/gocsi/csc@latest
          echo "$(go env GOPATH)/bin" >> $GITHUB_PATH

      - name: Unit tests (real ZFS on installed pool)
        # Not /usr/local/go/bin/go: Go comes from setup-go's tool cache, and
        # sudo drops PATH, so pass it through explicitly.
        run: sudo env "PATH=$PATH" go test ./pkg/...

      - name: Run e2e
        run: sudo env CSC="$(go env GOPATH)/bin/csc" TARGET_ADDR=127.0.0.1 POOL=nvme TRSVCID=4420 ./test/manual/e2e.sh
