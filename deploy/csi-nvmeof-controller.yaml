apiVersion: apps/v1
kind: Deployment
metadata:
  name: nvmeof-csi-controller
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: nvmeof-csi
      app.kubernetes.io/component: controller
  template:
    metadata:
      labels:
        app.kubernetes.io/name: nvmeof-csi
        app.kubernetes.io/component: controller
    spec:
      containers:
        - name: nvmeof-csi
          # TODO: pin to a released image; placeholder for now.
          image: timpa0130/nvmeof-csi:latest
          imagePullPolicy: IfNotPresent
          securityContext:
            privileged: true # nvmet configfs + zvol device access
          args:
            - --mode=controller
            - --socket=/run/csi/nvmeof-csi.sock
            # Controller/backend host that initiator nodes connect to.
            - --target-addr=10.0.0.100
            - --port=4420
            - --pool=nvme
          volumeMounts:
            - name: csi-socket
              mountPath: /run/csi
            - name: nvmet-config
              mountPath: /sys/kernel/config
            - name: zfs-dev
              mountPath: /dev/zvol
      volumes:
        - name: csi-socket
          emptyDir: {}
        - name: nvmet-config
          hostPath:
            path: /sys/kernel/config
        - name: zfs-dev
          hostPath:
            path: /dev/zvol
