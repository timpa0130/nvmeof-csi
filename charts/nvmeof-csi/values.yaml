# Default values for nvmeof-csi.
replicaCount: 1

image:
  repository: ghcr.io/timpa0130/nvmeof-csi
  tag: latest
  pullPolicy: Always

csi:
  # CSI plugin name advertised by the driver; also the CSIDriver name,
  # the StorageClass provisioner, and the kubelet plugin dir name.
  pluginName: com.timpa0130.nvmeof-csi
  pluginVersion: "1.0.0"

storageClass:
  name: nvmeof-csi

provisioner:
  # Also runs csi-attacher; without it no volume can attach to a node.
  enabled: true
  # gRPC TCP endpoint of the controller on the storage host
  # (NVMEOF_CSI_LISTEN of nvmeof-csi-controller.service).
  controllerAddr: 192.168.1.10:9090

node:
  enabled: true
  mode: node
  # NVMe-oF/TCP backend the node initiates to.
  targetAddr: 192.168.1.10
  port: "4420"
  pool: nvme

# Cluster ID of this Kubernetes cluster, passed to every component: it keeps
# this cluster's zvols (pool/<cluster>/...), subsystem NQNs and host grants
# apart from other clusters sharing the same pool and target host. Empty is the
# single-cluster layout. Set it to match NVMEOF_CSI_CLUSTER of the controller
# on the target host, and give each cluster its own controller, port and
# nvmet port number (design/deployment.md).
cluster: ""
