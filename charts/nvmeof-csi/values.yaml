# Default values for nvmeof-csi.
replicaCount: 1

image:
  repository: ghcr.io/timpa0130/nvmeof-csi
  tag: latest
  pullPolicy: Always

csi:
  # CSI plugin name advertised by the driver; also the CSIDriver name,
  # the StorageClass provisioner, and the kubelet plugin dir name.
  pluginName: com.timpa0130.nvmeof-csi
  pluginVersion: "1.0.0"

storageClass:
  name: nvmeof-csi

controller:
  enabled: false
  replicaCount: 1
  mode: controller
  # Optional TCP address to also serve the CSI gRPC API on, for sidecars
  # (e.g. external-provisioner) running on other hosts. Empty = disabled.
  listen: ""
  # Address initiators (K8s nodes / pods) connect to — the NVMe-oF/TCP
  # backend host. May point at a single external storage node.
  targetAddr: 192.168.1.107
  port: "4420"
  pool: nvme

node:
  enabled: true
  mode: node
  # NVMe-oF/TCP backend the node initiates to.
  targetAddr: 192.168.1.107
  port: "4420"
  pool: nvme
