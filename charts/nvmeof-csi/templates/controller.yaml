{{- if .Values.controller.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nvmeof-csi-controller
  namespace: {{ .Release.Namespace }}
spec:
  replicas: {{ .Values.controller.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: nvmeof-csi
      app.kubernetes.io/component: controller
  template:
    metadata:
      labels:
        app.kubernetes.io/name: nvmeof-csi
        app.kubernetes.io/component: controller
    spec:
      containers:
        - name: nvmeof-csi
          image: {{ .Values.image.repository }}:{{ .Values.image.tag }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            privileged: true # nvmet configfs + zvol device access
          args:
            - --mode={{ .Values.controller.mode }}
            - --socket=/run/csi/nvmeof-csi.sock
            - --target-addr={{ .Values.controller.targetAddr }}
            - --port={{ .Values.controller.port }}
            - --pool={{ .Values.controller.pool }}
          volumeMounts:
            - name: csi-socket
              mountPath: /run/csi
            - name: nvmet-config
              mountPath: /sys/kernel/config
            - name: zfs-dev
              mountPath: /dev/zvol
      volumes:
        - name: csi-socket
          emptyDir: {}
        - name: nvmet-config
          hostPath:
            path: /sys/kernel/config
        - name: zfs-dev
          hostPath:
            path: /dev/zvol
{{- end }}
