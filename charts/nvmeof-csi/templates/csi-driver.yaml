apiVersion: storage.k8s.io/v1
kind: CSIDriver
metadata:
  # Must equal the driver's GetPluginInfo name — kubelet matches on it.
  name: {{ .Values.csi.pluginName }}
spec:
  # VolumeAttachments enforce single-node access: the external-attacher
  # calls ControllerPublish, which grants the node access on the target.
  attachRequired: true
  fsGroupPolicy: File
  volumeLifecycleModes:
    - Persistent