apiVersion: storage.k8s.io/v1
kind: CSIDriver
metadata:
  # Must equal the driver's GetPluginInfo name — kubelet matches on it.
  name: {{ .Values.csi.pluginName }}
spec:
  # No external-attacher sidecar; ControllerPublish is a no-op.
  attachRequired: false
  fsGroupPolicy: File
  volumeLifecycleModes:
    - Persistent