{{- if .Values.node.enabled }}
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: nvmeof-csi-node
  namespace: {{ .Release.Namespace }}
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: nvmeof-csi
      app.kubernetes.io/component: node
  template:
    metadata:
      labels:
        app.kubernetes.io/name: nvmeof-csi
        app.kubernetes.io/component: node
    spec:
      tolerations:
        - operator: Exists
      containers:
        - name: nvmeof-csi
          image: {{ .Values.image.repository }}:{{ .Values.image.tag }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            privileged: true # /dev, mount propagation, nvme CLI
          args:
            - --mode={{ .Values.node.mode }}
            # Socket must live on the host where kubelet can dial it.
            - --socket=/var/lib/kubelet/plugins/{{ .Values.csi.pluginName }}/csi.sock
            - --target-addr={{ .Values.node.targetAddr }}
            - --port={{ .Values.node.port }}
            - --pool={{ .Values.node.pool }}
            - --node-id=$(NODE_NAME)
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          volumeMounts:
            - name: socket-dir
              mountPath: /var/lib/kubelet/plugins/{{ .Values.csi.pluginName }}
            # Bidirectional propagation makes mounts the driver creates
            # (staging, publish) visible to kubelet and pods.
            - name: kubelet-dir
              mountPath: /var/lib/kubelet
              mountPropagation: Bidirectional
            - name: dev
              mountPath: /dev
            - name: nvmet-config
              mountPath: /sys/kernel/config
        - name: node-driver-registrar
          image: registry.k8s.io/sig-storage/csi-node-driver-registrar:v2.13.0
          args:
            - --csi-address=/var/lib/kubelet/plugins/{{ .Values.csi.pluginName }}/csi.sock
            - --kubelet-registration-path=/var/lib/kubelet/plugins/{{ .Values.csi.pluginName }}/csi.sock
          volumeMounts:
            - name: socket-dir
              mountPath: /var/lib/kubelet/plugins/{{ .Values.csi.pluginName }}
            - name: registration-dir
              mountPath: /registration
      volumes:
        - name: socket-dir
          hostPath:
            path: /var/lib/kubelet/plugins/{{ .Values.csi.pluginName }}
            type: DirectoryOrCreate
        - name: registration-dir
          hostPath:
            path: /var/lib/kubelet/plugins_registry
            type: DirectoryOrCreate
        - name: kubelet-dir
          hostPath:
            path: /var/lib/kubelet
            type: Directory
        - name: dev
          hostPath:
            path: /dev
            type: Directory
        - name: nvmet-config
          hostPath:
            path: /sys/kernel/config
{{- end }}