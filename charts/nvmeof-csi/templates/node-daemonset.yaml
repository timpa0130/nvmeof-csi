{{- if .Values.node.enabled }}
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: nvmeof-csi-node
  namespace: {{ .Release.Namespace }}
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: nvmeof-csi
      app.kubernetes.io/component: node
  template:
    metadata:
      labels:
        app.kubernetes.io/name: nvmeof-csi
        app.kubernetes.io/component: node
    spec:
      tolerations:
        - operator: Exists
      containers:
        - name: nvmeof-csi
          image: {{ .Values.image.repository }}:{{ .Values.image.tag }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            privileged: true # nvmet configfs + /dev/nvme* access
          args:
            - --mode={{ .Values.node.mode }}
            - --socket=/run/csi/nvmeof-csi.sock
            - --target-addr={{ .Values.node.targetAddr }}
            - --port={{ .Values.node.port }}
            - --pool={{ .Values.node.pool }}
            - --node-id=$(NODE_NAME)
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          volumeMounts:
            - name: csi-socket
              mountPath: /run/csi
            - name: nvmet-config
              mountPath: /sys/kernel/config
      volumes:
        - name: csi-socket
          emptyDir: {}
        - name: nvmet-config
          hostPath:
            path: /sys/kernel/config
{{- end }}
